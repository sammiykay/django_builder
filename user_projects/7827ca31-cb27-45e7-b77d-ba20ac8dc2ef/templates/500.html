<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Boutique - Server Error</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .error-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-content {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        .error-code {
            font-size: 6rem;
            color: #dc3545;
            font-weight: bold;
        }
        .error-message {
            font-size: 1.5rem;
            color: #343a40;
            margin: 1rem 0;
        }
        .home-button {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-code">500</div>
            <h1 class="error-message">Oops! Something went wrong</h1>
            <p class="lead">We're experiencing some technical difficulties.</p>
            <p>Our team has been notified and is working to fix the issue.</p>
            <div class="home-button">
                <a href="/" class="btn btn-primary btn-lg">Return to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
