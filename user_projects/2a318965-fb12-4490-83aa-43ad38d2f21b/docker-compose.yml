version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=social_sphere.settings
      - DATABASE_URL=postgres://postgres:postgres@db:5432/social_sphere
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=social_sphere
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:6
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A social_sphere worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=social_sphere.settings
      - DATABASE_URL=postgres://postgres:postgres@db:5432/social_sphere
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - web
      - db
      - redis

volumes:
  postgres_data: