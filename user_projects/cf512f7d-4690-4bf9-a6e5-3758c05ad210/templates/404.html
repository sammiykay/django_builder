<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Social Pulse Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 20px;
        }
        h1 {
            color: #333;
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .error-code {
            color: #e74c3c;
            font-size: 6rem;
            font-weight: bold;
            margin: 0;
        }
        p {
            color: #666;
            font-size: 1.2rem;
            margin: 1rem 0;
        }
        .home-button {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .home-button:hover {
            background-color: #2980b9;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pulse">
            <p class="error-code">404</p>
        </div>
        <h1>Oops!</h1>
        <p>The page you're looking for seems to have vanished into the digital void.</p>
        <p>Don't worry, it happens to the best of us!</p>
        <a href="/" class="home-button">Return to Dashboard</a>
    </div>
</body>
</html>
