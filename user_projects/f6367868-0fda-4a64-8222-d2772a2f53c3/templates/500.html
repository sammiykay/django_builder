<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Django Boutique</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .error-container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        h1 {
            color: #555;
            margin-bottom: 1rem;
        }
        .error-code {
            font-size: 72px;
            color: #dc3545;
            margin: 0;
        }
        .message {
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .home-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .home-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <p class="error-code">500</p>
        <h1>Server Error</h1>
        <div class="message">
            <p>We're sorry, but something went wrong on our end.</p>
            <p>Our technical team has been notified and is working to fix the issue.</p>
            <p>Please try again later or return to our homepage.</p>
        </div>
        <a href="{% url 'home' %}" class="home-button">Return to Homepage</a>
    </div>
</body>
</html>
